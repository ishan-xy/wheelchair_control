[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts =
  pre:scripts/load_env.py
lib_deps =
  h2zero/NimBLE-Arduino @ 2.5.0
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=0
build_unflags =
  -std=gnu++11
check_tool = cppcheck
check_flags =
  cppcheck: --enable=warning,performance,portability
